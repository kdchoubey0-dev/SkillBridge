  <text x="314" y="168" font-family="Manrope, Arial, sans-serif" font-size="23" font-weight="800" fill="#536171">Global skills. Real projects. Verified proof.</text>
  <text x="314" y="202" font-family="Manrope, Arial, sans-serif" font-size="17" font-weight="700" fill="#718093">Designed for learners and teams across the US, Europe, and Asia.</text>
