<svg width="780" height="300" viewBox="0 0 780 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SkillBridge Global Logo</title>
  <desc id="desc">A global SkillBridge logo using modular blocks, orbit paths, and a negative-space pathway for international project learning.</desc>
